<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the safe-area insets in CSS actually resolve on
         notched phones; user-scalable=no stops a pinch mid-corner. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d12" />
    <!-- Inline SVG icon: avoids a favicon.ico round trip (and the 404 console
         error that portal QA counts against you) with no extra request. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Cpath d='M5 21c5-2 8-9 13-9 4 0 7 2 9 5' stroke='%23ffcc33' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='11' cy='24' r='3' fill='%23f4f6fb'/%3E%3Ccircle cx='23' cy='24' r='3' fill='%23f4f6fb'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Drift Circuit — a browser time-attack racer. Drift to bank boost, chain corners, and beat your own ghost."
    />
    <title>Drift Circuit — Time Attack Racing</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="loading">
        <div class="spinner"></div>
        <p style="color: #a5adbf; font-size: 14px">Loading circuit…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
